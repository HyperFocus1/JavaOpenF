mp.messaging.connector.smallrye-kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.outgoing.tasks-out.connector=smallrye-kafka
mp.messaging.outgoing.tasks-out.topic=tasks.events
mp.messaging.outgoing.tasks-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.tasks-out.acks=all

mp.messaging.incoming.tasks-in.connector=smallrye-kafka
mp.messaging.incoming.tasks-in.topic=tasks.events
mp.messaging.incoming.tasks-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.tasks-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.tasks-in.group.id=${WEBSOCKET_CONSUMER_GROUP:openf-websocket-node-1}
mp.messaging.incoming.tasks-in.auto.offset.reset=latest
mp.messaging.incoming.tasks-in.enable.auto.commit=false
mp.messaging.incoming.tasks-in.commit-strategy=throttled
mp.messaging.incoming.tasks-in.failure-strategy=fail

app.websocket.origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
